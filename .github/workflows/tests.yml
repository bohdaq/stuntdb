name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python scripts/package_smoke.py
      - run: python -m twine check dist/*
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mysql:8.4', 'mariadb:10.11', 'mariadb:11.4']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: stuntdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -ptest-only-password || mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m mysql
        env:
          STUNTDB_TEST_MYSQL_URL: mysql+pymysql://root:test-only-password@127.0.0.1:3306/stuntdb_test
  zoo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mysql:8.4', 'mariadb:10.11', 'mariadb:11.4']
        sample: [sakila, employees, frameworks]
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: stuntdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -ptest-only-password || mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Load full upstream sample database
        if: matrix.sample != 'frameworks'
        run: scripts/load_zoo.sh "$STUNTDB_ZOO_SAMPLE"
        env:
          STUNTDB_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          STUNTDB_ZOO_SAMPLE: ${{ matrix.sample }}
      - run: python -m pytest -q -m zoo
        env:
          STUNTDB_ZOO_URL: mysql+pymysql://root:test-only-password@127.0.0.1:3306/stuntdb_test
          STUNTDB_ZOO_SAMPLE: ${{ matrix.sample }}
