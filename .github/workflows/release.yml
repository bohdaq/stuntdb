name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful main CI and matching version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, runpy, subprocess
          version = runpy.run_path('src/stuntdb/__init__.py')['__version__']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          runs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/workflows/tests.yml/runs?head_sha={sha}&branch=main&event=push']))
          assert any(r['head_sha'] == sha and r['conclusion'] == 'success' for r in runs['workflow_runs']), 'Main CI must succeed on the release commit'
          PY
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python scripts/package_smoke.py
      - run: python -m twine check dist/*
      - name: Checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "stuntdb $GITHUB_REF_NAME" --notes-file docs/release-notes.md
