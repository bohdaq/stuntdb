[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stuntdb"
version = "0.1.0a1"
description = "Cycle-safe database subsets for development"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]

[project.scripts]
stuntdb = "stuntdb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: integration tests requiring a disposable MySQL 8 database",
           "zoo: full sample databases and framework-shaped fixtures"]
